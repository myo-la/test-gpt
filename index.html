<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Core Defense</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="topbar">
        <h1>Tower Core Defense</h1>
        <button id="pause-btn" type="button" class="pause-btn">Pause</button>
      </header>

      <section class="hud" aria-label="Game stats">
        <p>❤️ HP: <span id="hp">100</span></p>
        <p>💰 Credits: <span id="credits">80</span></p>
        <p>🌊 Wave: <span id="wave">1</span></p>
        <p>⚙️ Fire Rate: <span id="fire-rate">1.0/s</span></p>
      </section>

      <section class="arena-wrap">
        <canvas id="arena" width="420" height="700" aria-label="Game arena"></canvas>
      </section>

      <section class="upgrades" aria-label="Upgrade controls">
        <button type="button" class="upgrade" data-upgrade="damage">Damage +1 (<span id="cost-damage">25</span>)</button>
        <button type="button" class="upgrade" data-upgrade="speed">Fire Rate +15% (<span id="cost-speed">30</span>)</button>
        <button type="button" class="upgrade" data-upgrade="heal">Repair +15 HP (<span id="cost-heal">35</span>)</button>
      </section>

      <p id="message" class="message">Tap and hold to aim your tower. Survive as many waves as possible.</p>
      <button id="restart-btn" type="button" class="restart" hidden>Restart</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
